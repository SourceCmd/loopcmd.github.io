<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024"
     viewBox="0 0 220 220"
     role="img"
     aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Loop Cmd</title>
  <desc id="desc">An ivory chevron prompt next to a glacier-blue ring with a glowing node on it, on a deep blue backdrop.</desc>

  <defs>
    <!-- Background: deep blue gradient -->
    <linearGradient id="bg-glacier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#102C40"/>
      <stop offset="100%" stop-color="#07141E"/>
    </linearGradient>

    <!-- Ring: vertical gradient (bottom deep blue, middle glacier, top pale) -->
    <linearGradient id="glacier-vert" gradientUnits="userSpaceOnUse" x1="0" y1="154" x2="0" y2="70">
      <stop offset="0%" stop-color="#3396D1"/>
      <stop offset="50%" stop-color="#86CDF2"/>
      <stop offset="100%" stop-color="#DAF1FF"/>
    </linearGradient>
  </defs>

  <!-- Background: full bleed, square corners -->
  <rect width="220" height="220" fill="url(#bg-glacier)"/>

  <!-- Chevron: same geometry as Hearth Cmd, ivory (#EFE8DA) -->
  <path d="M 48 148 L 84 110 L 48 72"
        fill="none"
        stroke="#EFE8DA"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Ring: outer radius 42 (x 100-184, y 70-154), band 18 -->
  <circle cx="142" cy="112" r="33" fill="none" stroke="url(#glacier-vert)" stroke-width="18"/>

  <!-- Node: dark outer + pale glow, echoing Hearth's window -->
  <circle cx="165.3" cy="88.7" r="11" fill="#102C40"/>
  <circle cx="165.3" cy="88.7" r="6"  fill="#DAF1FF"/>
</svg>
